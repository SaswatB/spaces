name: OpenAPI Sync

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-openapi-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI sync
        run: pnpm openapi:check
